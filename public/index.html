<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlesque News</title>
    <meta name="description" content="Bruges, Belgium, Europe and the world. Hourly, deduplicated and without the clickbait." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131214" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint, so the page never flashes the other one.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app.css" />
    <link rel="preload" href="/api/public/news.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the news</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="#" aria-label="Atlesque News, home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" /><path d="M10 22V10h2.2l7.6 8.3V10H22v12h-2.2l-7.6-8.3V22z" /></svg>
          <span id="site-title" class="brand-name">Atlesque News</span>
        </a>

        <nav class="regions" aria-label="Sections">
          <ul id="section-nav">
            <li><a href="#" data-region="">Home</a></li>
          </ul>
        </nav>

        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" /></svg>
        </button>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1">
      <h1 id="page-title" class="sr-only">Latest news</h1>

      <div id="breaking" class="breaking" hidden>
        <p class="breaking-label"><span class="pulse" aria-hidden="true"></span>Breaking</p>
        <ul id="breaking-list"></ul>
      </div>

      <div id="content">
        <p class="loading">Loading the latest news…</p>
      </div>
      <p id="status" class="sr-only" role="status"></p>
    </main>

    <footer class="wrap footer">
      <p>Summaries are written by AI from the linked reports and can contain mistakes. <span id="updated"></span></p>
    </footer>

    <span id="new-tab-hint" hidden>Opens the source in a new tab</span>
    <noscript><p class="wrap">This page needs JavaScript to show the news.</p></noscript>
    <script src="/app.js" defer></script>
  </body>
</html>
